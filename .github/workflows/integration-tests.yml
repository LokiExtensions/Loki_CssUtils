name: Magento 2 Integration Tests
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect integration tests
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.check.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Test/Integration

      - name: Check for integration tests
        id: check
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE/Test/Integration" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No integration tests found in Test/Integration, skipping"
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

  integration-tests:
    name: Magento 2 Integration Tests
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.INTEGRATION_JOB_TIMEOUT || '45') }}
    container:
      image: yireo/magento2installed:${{ vars.MAGENTO_VERSION || '2.4.8-p5' }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME || '' }}
        password: ${{ secrets.DOCKERHUB_TOKEN || '' }}
      options: --user root
    env:
      MAGENTO_VERSION: ${{ vars.MAGENTO_VERSION || '2.4.8-p5' }}
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    services:
      mysql:
        image: yireo/mariadb:10
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME || '' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: magento2
          MYSQL_PASSWORD: magento2
          MYSQL_DATABASE: magento2
        options: --tmpfs /tmp:rw --tmpfs /var/lib/mysql:rw --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
      opensearch:
        image: yireo/opensearch:latest
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME || '' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || '' }}
        env:
          'discovery.type': single-node
          OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "admin"
        options: --health-cmd="curl localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s" --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cleanup PHP
        run: rm -f /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini

      - name: Apply Magento patches
        shell: bash
        run: |
          cd /tmp/magento
          for PATCH in patches/39216.diff patches/40410.diff; do
            if [ ! -f "$PATCH" ]; then
              echo "Patch $PATCH not found, skipping"
            elif git apply -R --check "$PATCH" 2>/dev/null; then
              echo "Patch $PATCH already applied"
            else
              git apply "$PATCH"
              echo "Applied patch $PATCH"
            fi
          done

      - name: Setting up module variables
        run: |
          echo "COMPOSER_NAME=$(jq -er '.name' composer.json)" >> "$GITHUB_ENV"
          echo "MAGENTO_MODULE=$(jq -er '.module_name' MODULE.json)" >> "$GITHUB_ENV"

      - name: Configure Composer
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          LOKI_REPO_USERNAME: ${{ secrets.LOKI_REPO_USERNAME }}
          LOKI_REPO_PASSWORD: ${{ secrets.LOKI_REPO_PASSWORD }}
          MAGENTO_MARKETPLACE_PUBLIC_KEY: ${{ secrets.MAGENTO_MARKETPLACE_PUBLIC_KEY }}
          MAGENTO_MARKETPLACE_PRIVATE_KEY: ${{ secrets.MAGENTO_MARKETPLACE_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/composer-setup.sh"

      - name: Restore Composer cache
        if: github.event.pull_request.head.repo.fork != true && !env.ACT
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: composer-integration-${{ env.MAGENTO_VERSION }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-integration-${{ env.MAGENTO_VERSION }}-

      - name: Add module source
        run: |
          cp -R "$GITHUB_WORKSPACE" /tmp/magento/package-source
          cd /tmp/magento
          composer config repositories.local-source path package-source/
          composer require -n --prefer-dist -- "${COMPOSER_NAME}:@dev" yireo/magento2-integration-test-helper

      - name: Run Magento 2 Integration Tests
        shell: bash
        run: |
          cd /tmp/magento/dev/tests/integration/
          cp -R "$GITHUB_WORKSPACE"/.github/workflows/integration-tests/* .
          if php ../../../vendor/bin/phpunit --atleast-version 10; then
            cp phpunit10.xml phpunit.xml
          elif php ../../../vendor/bin/phpunit --atleast-version 9; then
            cp phpunit9.xml phpunit.xml
          fi
          php -d memory_limit=-1 ../../../vendor/bin/phpunit -c phpunit.xml "../../../vendor/${COMPOSER_NAME}/Test/Integration"
