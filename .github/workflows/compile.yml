name: Magento 2 DI compilation
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Magento versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            MODULE.json
          sparse-checkout-cone-mode: false

      - name: Determine Magento versions
        id: versions
        shell: bash
        run: |
          ALL='["2.4.7-p10", "2.4.8-p5", "2.4.9"]'
          if [ ! -f MODULE.json ]; then
            echo "::notice::No MODULE.json found, skipping compilation"
            echo "versions=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSIONS=$(jq -c --argjson all "$ALL" '(.skip_magento_versions // []) as $skip | $all - $skip' MODULE.json)
          echo "Magento versions: $VERSIONS"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  compile:
    name: Magento 2 DI compilation
    needs: detect
    if: needs.detect.outputs.versions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.COMPILE_JOB_TIMEOUT || '30') }}
    strategy:
      fail-fast: false
      matrix:
        magento_version: ${{ fromJSON(needs.detect.outputs.versions) }}
    container:
      image: yireo/magento2installed:${{ matrix.magento_version }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME || '' }}
        password: ${{ secrets.DOCKERHUB_TOKEN || '' }}
      options: --user root
    env:
      MAGENTO_VERSION: ${{ matrix.magento_version }}
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cleanup PHP
        run: rm -f /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini

      - name: Setting up module variables
        run: |
          echo "COMPOSER_NAME=$(jq -r '.name' composer.json)" >> "$GITHUB_ENV"
          echo "MAGENTO_MODULE=$(jq -r '.module_name' MODULE.json)" >> "$GITHUB_ENV"

      - name: Configure Composer
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          LOKI_REPO_USERNAME: ${{ secrets.LOKI_REPO_USERNAME }}
          LOKI_REPO_PASSWORD: ${{ secrets.LOKI_REPO_PASSWORD }}
          MAGENTO_MARKETPLACE_PUBLIC_KEY: ${{ secrets.MAGENTO_MARKETPLACE_PUBLIC_KEY }}
          MAGENTO_MARKETPLACE_PRIVATE_KEY: ${{ secrets.MAGENTO_MARKETPLACE_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATE_GITHUB_TOKEN: "1"
        run: bash "$GITHUB_WORKSPACE/.github/workflows/composer-setup.sh"

      - name: Restore Composer cache
        if: github.event.pull_request.head.repo.fork != true && !env.ACT
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: composer-compile-${{ matrix.magento_version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-compile-${{ matrix.magento_version }}-

      - name: Add module source
        run: |
          cp -R "$GITHUB_WORKSPACE" /tmp/magento/package-source
          cd /tmp/magento
          composer config repositories.local-source path package-source/
          composer require -n --prefer-dist -- "${COMPOSER_NAME}:@dev"

      - name: Run Magento 2 compilation
        run: |
          cd /tmp/magento
          bin/magento module:enable --all
          php -dzend.enable_gc=0 -drealpath_cache_size=64M -drealpath_cache_ttl=7200 -dopcache.enable_cli=1 -dopcache.memory_consumption=512 -dopcache.interned_strings_buffer=64 -dopcache.max_accelerated_files=100000 -dmemory_limit=-1 bin/magento setup:di:compile
