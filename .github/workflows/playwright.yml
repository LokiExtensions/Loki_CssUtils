name: Playwright test
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  has-playwright:
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.check.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Test/Playwright

      - name: Check for Playwright tests
        id: check
        shell: bash
        run: |
          if find "$GITHUB_WORKSPACE/Test/Playwright" -type f -name '*.spec.ts' -not -path '*/node_modules/*' -print -quit 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Playwright tests found in Test/Playwright, skipping"
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

  playwright:
    needs: has-playwright
    if: needs.has-playwright.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.PLAYWRIGHT_JOB_TIMEOUT || '45') }}
    container:
      image: yireo/playwright:1.63.0
      options: --user root
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

    env: &magento-env
      MAGENTO_BASE_URL: "https://php:8443/"
      MAGENTO_BACKEND_FRONTNAME: "admin"
      MAGENTO_ADMIN_FIRSTNAME: "CI"
      MAGENTO_ADMIN_LASTNAME: "User"
      MAGENTO_ADMIN_EMAIL: "admin@example.com"
      MAGENTO_ADMIN_USER: "admin"
      MAGENTO_ADMIN_PASSWORD: "Admin123!@#"
      MAGENTO_LANGUAGE: "en_US"
      MAGENTO_CURRENCY: "USD"
      MAGENTO_TIMEZONE: "UTC"
      MAGENTO_USE_REWRITES: "1"
      MAGENTO_SEARCH_ENGINE: "opensearch"
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_MEMORY_LIMIT: "-1"
      MYSQL_HOST: "mysql"
      MYSQL_USER: "magento2"
      MYSQL_PASSWORD: "magento2"
      MYSQL_DATABASE: "magento2"
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_PORT: "3306"
      OPENSEARCH_HOST: "opensearch"
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_JAVA_OPTS: "-Xms128m -Xmx128m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "admin"
      MAGENTO_VERSION: ${{ vars.MAGENTO_VERSION || '2.4.8-p5' }}
      DISABLE_INVENTORY: ${{ vars.DISABLE_INVENTORY || false }}
      DISABLE_GRAPHQL: ${{ vars.DISABLE_GRAPHQL || false }}
      DISABLE_ADOBE: ${{ vars.DISABLE_ADOBE || false }}

    services:
      php:
        image: yireo/magento2installed:${{ vars.MAGENTO_VERSION || '2.4.8-p5' }}
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME || '' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || '' }}
        env: *magento-env

      mysql:
        image: yireo/mariadb:10
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME || '' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || '' }}
        env:
          MYSQL_DATABASE: magento2
          MYSQL_USER: magento2
          MYSQL_PASSWORD: magento2
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME || '' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || '' }}
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

      opensearch:
        image: yireo/opensearch
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME || '' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || '' }}
        env:
          OPENSEARCH_JAVA_OPTS: "-Xms128m -Xmx128m"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "admin"
        options: --health-cmd="curl localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setting up module variables
        run: |
          echo "COMPOSER_NAME=$(jq -r '.name' composer.json)" >> "$GITHUB_ENV"
          echo "MAGENTO_MODULE=$(jq -r '.module_name' MODULE.json)" >> "$GITHUB_ENV"
          PHP_CONTAINER="${{ job.services.php.id }}"
          if [ -z "$PHP_CONTAINER" ] && [ -n "$ACT" ]; then
            # act does not expose service container IDs, so look it up via the job network
            NETWORK=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(hostname)" 2>/dev/null || true)
            PHP_CONTAINER=$(docker ps -q --filter "ancestor=yireo/magento2installed:$MAGENTO_VERSION" ${NETWORK:+--filter "network=$NETWORK"} | head -n1)
          fi
          test -n "$PHP_CONTAINER" || { echo "::error::Could not determine PHP service container"; exit 1; }
          echo "PHP_CONTAINER=$PHP_CONTAINER" >> "$GITHUB_ENV"

      - name: Copy module source into PHP container
        run: docker cp "$GITHUB_WORKSPACE" "$PHP_CONTAINER:/tmp/magento/package-source"

      - name: Configure Composer
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          LOKI_REPO_USERNAME: ${{ secrets.LOKI_REPO_USERNAME }}
          LOKI_REPO_PASSWORD: ${{ secrets.LOKI_REPO_PASSWORD }}
          MAGENTO_MARKETPLACE_PUBLIC_KEY: ${{ secrets.MAGENTO_MARKETPLACE_PUBLIC_KEY }}
          MAGENTO_MARKETPLACE_PRIVATE_KEY: ${{ secrets.MAGENTO_MARKETPLACE_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker exec \
            -u root \
            -e GITLAB_TOKEN \
            -e LOKI_REPO_USERNAME \
            -e LOKI_REPO_PASSWORD \
            -e MAGENTO_MARKETPLACE_PUBLIC_KEY \
            -e MAGENTO_MARKETPLACE_PRIVATE_KEY \
            -e GITHUB_TOKEN \
            -e GITHUB_JOB \
            -e COMPOSER_NAME \
            -e MAGENTO_MODULE \
            -e MAGENTO_VERSION \
            -e PACKAGE_SOURCE=/tmp/magento/package-source \
            -e WITH_FUNCTIONAL_TEST_REPOS=1 \
            "$PHP_CONTAINER" bash -lc '
            set -e
            git config --global --add safe.directory /tmp/magento/package-source
            bash /tmp/magento/package-source/.github/workflows/composer-setup.sh
          '

      - name: Restore Composer cache
        if: github.event.pull_request.head.repo.fork != true && !env.ACT
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: composer-playwright-${{ env.MAGENTO_VERSION }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-playwright-${{ env.MAGENTO_VERSION }}-

      - name: Copy Composer cache into PHP container
        if: github.event.pull_request.head.repo.fork != true && !env.ACT
        run: |
          mkdir -p /tmp/composer-cache
          COMPOSER_CACHE_DIR=$(docker exec -u root "$PHP_CONTAINER" composer config --global cache-dir)
          echo "COMPOSER_CACHE_DIR=$COMPOSER_CACHE_DIR" >> "$GITHUB_ENV"
          docker exec -u root "$PHP_CONTAINER" mkdir -p "$COMPOSER_CACHE_DIR"
          docker cp /tmp/composer-cache/. "$PHP_CONTAINER:$COMPOSER_CACHE_DIR"

      - name: Add module source
        run: |
          docker exec \
            -u root \
            -e COMPOSER_NAME \
            "$PHP_CONTAINER" bash -lc '
            set -e
            cd /tmp/magento
            composer config repositories.local-source path /tmp/magento/package-source
            EXTRA_PACKAGES=""
            case "${COMPOSER_NAME}" in
              loki-checkout/*) EXTRA_PACKAGES="loki-checkout/magento2-functional-tests:dev-main" ;;
            esac
            composer require -n --prefer-dist -- \
              "${COMPOSER_NAME}:@dev" ${EXTRA_PACKAGES} \
              loki/magento2-functional-tests:dev-main \
              loki-checkout/magento2-luma:@dev \
              loki-checkout/magento2-sample-data:@dev \
              loki-checkout/magento2-hyva:@dev \
              yireo/magento2-enable-module-sequence:@dev \
              hyva-themes/magento2-default-theme-csp \
              hyva-themes/magento2-theme-module \
              hyva-themes/magento2-base-layout-reset \
              hyva-themes/magento2-email-module \
              hyva-themes/magento2-graphql-tokens \
              hyva-themes/magento2-graphql-view-model \
              hyva-themes/magento2-compat-module-fallback
          '

      - name: Copy Composer cache out of PHP container
        if: github.event.pull_request.head.repo.fork != true && !env.ACT
        run: docker cp "$PHP_CONTAINER:$COMPOSER_CACHE_DIR/." /tmp/composer-cache/

      - name: Setup Magento
        run: |
          ENV_ARGS=""
          for VAR in $(env | grep -oE '^(MAGENTO|MYSQL|OPENSEARCH|DISABLE)_[A-Z_]+'); do
            ENV_ARGS="$ENV_ARGS -e $VAR"
          done
          docker exec \
            -u root \
            -e COMPOSER_NAME \
            $ENV_ARGS \
            "$PHP_CONTAINER" bash -lc '
            set -e
            cd /tmp/magento
            GITHUB_WORKSPACE=/tmp/magento/package-source /tmp/magento/package-source/.github/workflows/magento-install.sh
            bin/magento module:disable Magento_AdminAdobeImsTwoFactorAuth Magento_TwoFactorAuth
            bin/magento module:enable Yireo_EnableModuleSequence
            EXTRA_MODULES=""
            case "${COMPOSER_NAME}" in
              loki-checkout/*) EXTRA_MODULES="LokiCheckout_FunctionalTests" ;;
            esac
            bin/magento module:sequence Loki_FunctionalTests LokiCheckout_SampleData LokiCheckout_Luma Hyva_Theme Hyva_BaseLayoutReset Hyva_Email Hyva_GraphqlTokens Hyva_GraphqlViewModel Hyva_OrderCancellationWebapi Hyva_CompatModuleFallback ${EXTRA_MODULES} ${MAGENTO_MODULE}
            bin/magento setup:upgrade
            bin/magento config:set dev/static/sign 0
            bin/magento setup:static-content:deploy -f --area frontend --area adminhtml en_US
            bin/magento loki-checkout:sample-data:install
            bin/magento loki:functional-tests:modules:dump
            bin/magento config:set loki/functional_tests/token loki
            bin/magento cache:flush config
          '

      - name: Copy Magento into job container
        run: |
          mkdir -p /tmp/magento
          docker cp "$PHP_CONTAINER:/tmp/magento/." /tmp/magento/

      - name: Compute npm cache key
        id: npm-cache-key
        working-directory: /tmp/magento/vendor/loki/magento2-functional-tests/Test/Playwright/
        run: |
          LOCK_FILE=package-lock.json
          test -f "$LOCK_FILE" || LOCK_FILE=package.json
          echo "hash=$(sha256sum "$LOCK_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ steps.npm-cache-key.outputs.hash }}
          restore-keys: |
            npm-

      - name: Wait for Magento front-end
        run: |
          echo "Waiting for Magento front-end at ${MAGENTO_BASE_URL}..."
          for i in {1..60}; do
            if curl -kfsS "${MAGENTO_BASE_URL}" >/dev/null; then
              echo "OK"; exit 0
            fi
            echo -n "."
            sleep 1
          done
          echo "ERROR: Magento front-end not reachable"; exit 1

      - name: Run Playwright tests
        working-directory: /tmp/magento/vendor/loki/magento2-functional-tests/Test/Playwright/
        env:
          CI: "true"
          MAGENTO_ROOT: /tmp/magento
          INTEGRATION_DETAILS: ${{ secrets.INTEGRATION_DETAILS || '' }}
          TEST_TIMEOUT: ${{ vars.TEST_TIMEOUT || '60000' }}
          PLAYWRIGHT_RETRIES: ${{ vars.PLAYWRIGHT_RETRIES || '1' }}
          PLAYWRIGHT_MAX_FAILURES: ${{ vars.PLAYWRIGHT_MAX_FAILURES || '5' }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: |
          echo "Installing npm dependencies..."
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline
          else
            npm install --prefer-offline --no-audit --no-fund
          fi
          npx playwright install chromium

          echo "Creating /tmp/magento/.env.playwright..."
          printf "TEST_URL=%s\nTEST_TOKEN=loki\nMODULE_NAME=%s\n" "${MAGENTO_BASE_URL}" "${MAGENTO_MODULE}" > /tmp/magento/.env.playwright

          echo "Running Playwright tests for project ${MAGENTO_MODULE}"
          npx playwright test \
            --project="${MAGENTO_MODULE}" \
            --reporter=list \
            --trace=off \
            --retries="${PLAYWRIGHT_RETRIES}" \
            --max-failures="${PLAYWRIGHT_MAX_FAILURES}"
