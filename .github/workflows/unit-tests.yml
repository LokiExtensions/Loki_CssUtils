name: Magento 2 Unit Tests
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect unit tests
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.check.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Test/Unit

      - name: Check for unit tests
        id: check
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE/Test/Unit" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No unit tests found in Test/Unit, skipping"
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: Magento 2 Unit Tests
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.UNIT_JOB_TIMEOUT || '30') }}
    container:
      image: yireo/magento2installed:${{ vars.MAGENTO_VERSION || '2.4.8-p5' }}
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME || '' }}
        password: ${{ secrets.DOCKERHUB_TOKEN || '' }}
      options: --user root
    env:
      MAGENTO_VERSION: ${{ vars.MAGENTO_VERSION || '2.4.8-p5' }}
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Cleanup PHP
        run: rm -f /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini

      - name: Setting up module variables
        run: |
          echo "COMPOSER_NAME=$(jq -r '.name' "$GITHUB_WORKSPACE/composer.json")" >> "$GITHUB_ENV"
          echo "MAGENTO_MODULE=$(jq -r '.module_name' "$GITHUB_WORKSPACE/MODULE.json")" >> "$GITHUB_ENV"

      - name: Configure Composer
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          LOKI_REPO_USERNAME: ${{ secrets.LOKI_REPO_USERNAME }}
          LOKI_REPO_PASSWORD: ${{ secrets.LOKI_REPO_PASSWORD }}
          MAGENTO_MARKETPLACE_PUBLIC_KEY: ${{ secrets.MAGENTO_MARKETPLACE_PUBLIC_KEY }}
          MAGENTO_MARKETPLACE_PRIVATE_KEY: ${{ secrets.MAGENTO_MARKETPLACE_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/composer-setup.sh"

      - name: Restore Composer cache
        if: github.event.pull_request.head.repo.fork != true && !env.ACT
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: composer-unit-${{ env.MAGENTO_VERSION }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-unit-${{ env.MAGENTO_VERSION }}-

      - name: Add module source
        run: |
          cp -R "$GITHUB_WORKSPACE" /tmp/magento/package-source
          cd /tmp/magento
          composer config repositories.local-source path package-source/
          composer require -n --prefer-dist -- "${COMPOSER_NAME}:@dev"

      - name: Run Magento 2 Unit Tests
        run: |
          cd /tmp/magento/dev/tests/unit/
          php -d memory_limit=-1 ../../../vendor/bin/phpunit -c phpunit.xml.dist "../../../vendor/${COMPOSER_NAME}/Test/Unit"
